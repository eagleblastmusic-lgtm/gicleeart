name: LC-3H one-shot implementation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: lc3h-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'gpt-work/launcher-composition-lc3h-tk-drag-feedback'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-work/launcher-composition-lc3h-tk-drag-feedback

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Apply exact LC-3H patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/apply_lc3h.py

      - name: Run focused regression suite
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q `
            tests/test_launcher_tk_drag_feedback.py `
            tests/test_launcher_drag_gesture.py `
            tests/test_launcher_tk_drag_targets.py `
            tests/test_launcher_tk_drag_bindings.py `
            tests/test_launcher_drag_geometry.py `
            tests/test_launcher_tile_order.py `
            tests/test_launcher_composition.py `
            tests/test_launcher_category_renderer.py `
            tests/test_launcher_grid_layout.py `
            tests/test_giclee_app_packaging.py

      - name: Validate working diff and technical scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --check

          $allowed = @(
            ".github/scripts/apply_lc3h.py",
            ".github/workflows/lc3h-one-shot.yml",
            "cursor-api/giclee_app/docs/launcher-composition-lc3h-contract.md",
            "cursor-api/giclee_app/docs/launcher.md",
            "cursor-api/giclee_app/dragdrop_category_launcher.py",
            "cursor-api/giclee_app/launcher_tk_drag_feedback.py",
            "cursor-api/tests/test_launcher_drag_gesture.py",
            "cursor-api/tests/test_launcher_tk_drag_feedback.py"
          ) | Sort-Object -Unique

          $changed = @(
            git diff --name-only origin/master...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique

          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            Write-Host "Changed:"; $changed | ForEach-Object { Write-Host "  $_" }
            Write-Host "Unexpected:"; $unexpected | ForEach-Object { Write-Host "  $_" }
            Write-Host "Missing:"; $missing | ForEach-Object { Write-Host "  $_" }
            throw "LC-3H technical scope guard failed"
          }

      - name: Remove one-shot tooling and create final commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath .github/scripts/apply_lc3h.py -Force
          Remove-Item -LiteralPath .github/workflows/lc3h-one-shot.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(launcher): extract Tk drag visual feedback"

      - name: Validate final six-file diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --check origin/master...HEAD

          $expected = @(
            "cursor-api/giclee_app/docs/launcher-composition-lc3h-contract.md",
            "cursor-api/giclee_app/docs/launcher.md",
            "cursor-api/giclee_app/dragdrop_category_launcher.py",
            "cursor-api/giclee_app/launcher_tk_drag_feedback.py",
            "cursor-api/tests/test_launcher_drag_gesture.py",
            "cursor-api/tests/test_launcher_tk_drag_feedback.py"
          ) | Sort-Object -Unique
          $actual = @(git diff --name-only origin/master...HEAD) | Where-Object { $_ } | Sort-Object -Unique

          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($actual.Count -ne 6 -or $unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            Write-Host "Final diff:"; $actual | ForEach-Object { Write-Host "  $_" }
            throw "LC-3H final scope guard failed"
          }

      - name: Push final implementation head
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git push origin HEAD:gpt-work/launcher-composition-lc3h-tk-drag-feedback
