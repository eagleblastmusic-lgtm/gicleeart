name: Apply theme liquid extraction

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-extraction:
    if: github.event.pull_request.head.ref == 'gpt-work/theme-liquid-inline-styles-extract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract inline theme styles
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path.cwd()
          theme_path = root / 'layout/theme.liquid'
          snippet_path = root / 'snippets/giclee-theme-inline-overrides.liquid'
          test_path = root / 'cursor-api/tests/test_theme_liquid_inline_overrides_extraction.py'
          doc_path = root / 'cursor-api/docs/theme-liquid-inline-overrides.md'

          theme = theme_path.read_text(encoding='utf-8')
          marker = "  {% render 'giclee-theme-inline-overrides' %}"
          start_anchor = "  <style>\n    #page-transition {"
          end_anchor = "\n  </style>"

          if marker not in theme:
              start = theme.index(start_anchor)
              end = theme.index(end_anchor, start) + len(end_anchor)
              block = theme[start:end]
              if len(block.splitlines()) != 1277:
                  raise SystemExit(f'unexpected extracted block line count: {len(block.splitlines())}')
              digest = sha256(block.encode('utf-8')).hexdigest()
              if digest != 'c50a2cc71a70084bec5d062fc954e1b0b47adacd120fbb48b304a6cc7605c69a':
                  raise SystemExit(f'unexpected extracted block digest: {digest}')
              rebuilt = theme[:start] + marker + theme[end:]
              if rebuilt.replace(marker, block, 1) != theme:
                  raise SystemExit('mechanical reconstruction check failed')
              snippet_path.write_text(block, encoding='utf-8')
              theme_path.write_text(rebuilt, encoding='utf-8')
          else:
              block = snippet_path.read_text(encoding='utf-8')

          test_path.write_text('''"""Mechanical extraction contract for the large inline theme CSS block."""\n\nfrom __future__ import annotations\n\nfrom hashlib import sha256\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nTHEME = ROOT / "layout" / "theme.liquid"\nSNIPPET = ROOT / "snippets" / "giclee-theme-inline-overrides.liquid"\nRENDER_MARKER = "  {% render 'giclee-theme-inline-overrides' %}"\nEXPECTED_SNIPPET_SHA256 = "c50a2cc71a70084bec5d062fc954e1b0b47adacd120fbb48b304a6cc7605c69a"\n\n\ndef test_theme_renders_extracted_inline_overrides_once() -> None:\n    theme = THEME.read_text(encoding="utf-8")\n    assert theme.count(RENDER_MARKER) == 1\n    assert theme.index(RENDER_MARKER) < theme.index("{% render 'skip-to-content-link'")\n\n\ndef test_extracted_snippet_preserves_the_mechanical_source_block() -> None:\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    assert len(snippet.splitlines()) == 1277\n    assert sha256(snippet.encode("utf-8")).hexdigest() == EXPECTED_SNIPPET_SHA256\n    assert snippet.startswith("  <style>\\n    #page-transition {")\n    assert snippet.endswith("  </style>")\n    assert snippet.count("<style>") == 1\n    assert snippet.count("</style>") == 1\n\n\ndef test_liquid_conditions_remain_inside_the_extracted_snippet() -> None:\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    required = (\n        "{% if template.suffix == 'faq' %}",\n        "{% if request.page_type == 'page' %}",\n        "{% if template.suffix == 'contact' %}",\n        "{% if template.suffix == 'fotografia-obraz' or template.suffix == 'szablon-wlasna-fotografia' %}",\n        "{% if template.suffix == 'giclee-frame' %}",\n    )\n    for token in required:\n        assert token in snippet\n\n\ndef test_reinserting_snippet_restores_original_layout_line_count() -> None:\n    theme = THEME.read_text(encoding="utf-8")\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    reconstructed = theme.replace(RENDER_MARKER, snippet, 1)\n    assert len(theme.splitlines()) == 1878\n    assert len(reconstructed.splitlines()) == 3154\n''', encoding='utf-8')

          doc_path.write_text('''# Theme inline overrides extraction\n\nThe large inline CSS block previously embedded in `layout/theme.liquid` now lives in:\n\n```text\nsnippets/giclee-theme-inline-overrides.liquid\n```\n\nThe layout renders the snippet at the exact previous location, immediately after the splash markup and before `skip-to-content-link`.\n\n## Scope\n\n- mechanical move only;\n- no selector, declaration, animation, Liquid condition, or ordering change;\n- no conversion to an asset because the block contains request/template-dependent Liquid conditions;\n- no deploy or live-theme mutation.\n\nThe regression test records the extracted block SHA-256 and line count, verifies the render location, and confirms that reinserting the snippet restores the original layout line count. Intentional future edits to this snippet must update the recorded digest.\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layout/theme.liquid \
                  snippets/giclee-theme-inline-overrides.liquid \
                  cursor-api/tests/test_theme_liquid_inline_overrides_extraction.py \
                  cursor-api/docs/theme-liquid-inline-overrides.md
          if git diff --cached --quiet; then
            echo "Theme extraction already applied."
            exit 0
          fi
          git commit -m "Extract inline theme styles"
          git push origin HEAD:${{ github.head_ref }}
