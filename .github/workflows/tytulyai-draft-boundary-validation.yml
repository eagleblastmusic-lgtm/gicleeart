name: Tytuly AI Draft Boundary Validation

on:
  push:
    branches:
      - gpt-work/runtime-foundation-tytulyai-draft-boundary

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated application roots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gicleeapp-tytulyai-boundary"
          $paths = [ordered]@{
            LOCALAPPDATA = Join-Path $runtimeRoot "LocalAppData"
            APPDATA = Join-Path $runtimeRoot "AppData"
            GICLEEAPP_LOCAL_ROOT = Join-Path $runtimeRoot "LocalRoot"
            GICLEEAPP_ROAMING_ROOT = Join-Path $runtimeRoot "RoamingRoot"
            PYTHONPYCACHEPREFIX = Join-Path $runtimeRoot "pycache"
            TEMP = Join-Path $runtimeRoot "temp"
            TMP = Join-Path $runtimeRoot "temp"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
          }

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile changed Python files
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile `
            Komponenty/tytulyai/storage.py `
            tests/test_tytulyai_draft_store_boundary.py

      - name: Run focused draft-store tests
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q `
            tests/test_tytulyai_storage.py `
            tests/test_tytulyai_draft_store_boundary.py `
            tests/test_stage1e_external_stores_3.py::test_title_drafts_write_external
