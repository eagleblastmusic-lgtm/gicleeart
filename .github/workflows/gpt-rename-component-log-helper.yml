name: Rename component log helper

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: component-log-helper-rename-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'gpt-work/runtime-foundation-launcher-logs' &&
      github.event.pull_request.draft == true
    runs-on: [self-hosted, Windows, X64, giclee-ci]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare report directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          $reportRoot = Join-Path $env:RUNNER_TEMP "component-log-helper-rename"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          "REPORT_ROOT=$reportRoot" >> $env:GITHUB_ENV

      - name: Compile and apply exact rename
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          python -m py_compile .github/scripts/gpt-rename-component-log-helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/gpt-rename-component-log-helper.py 2>&1 |
            Tee-Object -FilePath "$env:REPORT_ROOT\patcher.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate syntax and scoped diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          python -m py_compile `
            cursor-api/giclee_app/launcher.py `
            cursor-api/giclee_app/launcher_delegate.py `
            cursor-api/giclee_app/component_logs.py `
            cursor-api/tests/test_launcher_delegate.py `
            cursor-api/tests/test_launcher_logs_appdata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check -- cursor-api/giclee_app/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install focused test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:GITHUB_WORKSPACE\cursor-api"
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:GITHUB_WORKSPACE\cursor-api"
          python -m pytest -q `
            tests/test_launcher_delegate.py `
            tests/test_launcher_logs_appdata.py `
            tests/test_studio_imports.py::test_launcher_delegate_does_not_import_launcher_module 2>&1 |
            Tee-Object -FilePath "$env:REPORT_ROOT\pytest.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit launcher import rename
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cursor-api/giclee_app/launcher.py
          if (git diff --cached --quiet) {
            "launcher.py already committed" |
              Tee-Object -FilePath "$env:REPORT_ROOT\commit.txt"
            exit 0
          }
          git commit -m "fix(runtime): preserve launcher delegate import boundary" 2>&1 |
            Tee-Object -FilePath "$env:REPORT_ROOT\commit.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:HEAD_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload rename evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-log-helper-rename-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}
          if-no-files-found: warn
          retention-days: 14
