name: LC3F one-shot implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'gpt-work/launcher-composition-lc3f-tk-drag-bindings'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout LC-3F branch head
        uses: actions/checkout@v4
        with:
          ref: gpt-work/launcher-composition-lc3f-tk-drag-bindings
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply Tk drag binding adapter delegation
        run: python .github/scripts/apply_lc3f.py

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          pytest pillow requests customtkinter psutil packaging tkinterdnd2

      - name: Run LC-3F focused regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .artifacts/lc3f | Out-Null
          Push-Location cursor-api
          try {
            python -m pytest -q `
              tests/test_launcher_tk_drag_bindings.py `
              tests/test_launcher_drag_gesture.py `
              tests/test_launcher_drag_geometry.py `
              tests/test_launcher_tile_order.py `
              tests/test_launcher_composition.py `
              tests/test_launcher_category_renderer.py `
              tests/test_launcher_grid_layout.py `
              tests/test_giclee_app_packaging.py `
              --junitxml=../.artifacts/lc3f/junit.xml `
              2>&1 | Tee-Object -FilePath ../.artifacts/lc3f/pytest.txt
            if ($LASTEXITCODE -ne 0) {
              throw "LC-3F focused pytest failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload LC-3F focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lc3f-focused-${{ github.run_id }}
          path: .artifacts/lc3f
          if-no-files-found: warn
          retention-days: 7

      - name: Validate diff and scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff --check failed'
          }

          $allowed = @(
            'cursor-api/giclee_app/launcher_tk_drag_bindings.py',
            'cursor-api/giclee_app/dragdrop_category_launcher.py',
            'cursor-api/tests/test_launcher_tk_drag_bindings.py',
            'cursor-api/giclee_app/docs/launcher.md',
            'cursor-api/giclee_app/docs/launcher-composition-lc3f-contract.md'
          )
          $changed = @(
            git diff origin/master...HEAD --name-only
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object {
            $_ -notlike '.artifacts/*'
          } | Sort-Object -Unique
          $unexpected = @($changed | Where-Object {
            $_ -notin $allowed -and
            $_ -ne '.github/scripts/apply_lc3f.py' -and
            $_ -ne '.github/workflows/lc3f-one-shot.yml'
          })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected LC-3F paths: $($unexpected -join ', ')"
          }
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($missing.Count -gt 0) {
            throw "Missing LC-3F paths: $($missing -join ', ')"
          }

      - name: Commit implementation and remove one-shot helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_lc3f.py .github/workflows/lc3f-one-shot.yml
          git add `
            cursor-api/giclee_app/launcher_tk_drag_bindings.py `
            cursor-api/giclee_app/dragdrop_category_launcher.py `
            cursor-api/tests/test_launcher_tk_drag_bindings.py `
            cursor-api/giclee_app/docs/launcher.md `
            cursor-api/giclee_app/docs/launcher-composition-lc3f-contract.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw 'staged diff check failed'
          }
          git commit -m 'refactor(launcher): extract Tk drag binding adapter'
          git push origin HEAD:gpt-work/launcher-composition-lc3f-tk-drag-bindings
