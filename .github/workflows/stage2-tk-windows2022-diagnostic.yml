name: Stage 2 Tcl/Tk Windows 2022 Diagnostic

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-tk-win2022-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-2022-diagnostic:
    name: Exact GUI test and full baseline (Windows 2022)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated application directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gicleeapp-win2022-diagnostic"
          $paths = [ordered]@{
            LOCALAPPDATA = Join-Path $runtimeRoot "LocalAppData"
            APPDATA = Join-Path $runtimeRoot "AppData"
            GICLEEAPP_LOCAL_ROOT = Join-Path $runtimeRoot "LocalRoot"
            GICLEEAPP_ROAMING_ROOT = Join-Path $runtimeRoot "RoamingRoot"
            PYTHONPYCACHEPREFIX = Join-Path $runtimeRoot "pycache"
            GPT_STARTER_DIR = Join-Path $runtimeRoot "starter-files"
            THEME_ROOT = Join-Path $runtimeRoot "theme-root"
            TEMP = Join-Path $runtimeRoot "temp"
            TMP = Join-Path $runtimeRoot "temp"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
          }

      - name: Prepare setup-python Tcl/Tk runtime
        shell: pwsh
        run: .\.github\scripts\prepare-tk-runtime.ps1 -RuntimeName "windows-2022-diagnostic"

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run exact previously failing GUI test
        id: exact_gui
        continue-on-error: true
        working-directory: cursor-api
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-win2022-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          python -m pytest -q `
            --junitxml="$reportRoot\exact-junit.xml" `
            tests/test_studio_gicleeframe_fast_selection.py::test_media_section_selection_defers_heavy_details_to_on_demand `
            2>&1 | Tee-Object -FilePath "$reportRoot\exact-pytest.txt"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Run full pytest baseline
        id: full_baseline
        continue-on-error: true
        working-directory: cursor-api
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-win2022-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          python -m pytest -q `
            --junitxml="$reportRoot\junit.xml" `
            2>&1 | Tee-Object -FilePath "$reportRoot\pytest.txt"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Write diagnostic summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows 2022 Tcl/Tk diagnostic

          - runner: windows-2022
          - exact GUI test exit code: ${{ steps.exact_gui.outputs.exit_code }}
          - full baseline exit code: ${{ steps.full_baseline.outputs.exit_code }}
          - Tcl/Tk mode: direct actions/setup-python runtime
          - same-object Tk retry: disabled
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows 2022 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-win2022-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}\stage2-win2022-reports
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.exact_gui.outputs.exit_code }}" -ne "0") {
            throw "Exact GUI test failed on Windows 2022."
          }
          if ("${{ steps.full_baseline.outputs.exit_code }}" -ne "0") {
            throw "Full baseline failed on Windows 2022."
          }
