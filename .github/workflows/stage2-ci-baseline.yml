name: Stage 2 CI Baseline

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-smoke:
    name: Hermetic smoke (Windows 2022 / Python 3.13)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated runtime directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gicleeapp-smoke"
          $paths = [ordered]@{
            LOCALAPPDATA = Join-Path $runtimeRoot "LocalAppData"
            APPDATA = Join-Path $runtimeRoot "AppData"
            GICLEEAPP_LOCAL_ROOT = Join-Path $runtimeRoot "LocalRoot"
            GICLEEAPP_ROAMING_ROOT = Join-Path $runtimeRoot "RoamingRoot"
            PYTHONPYCACHEPREFIX = Join-Path $runtimeRoot "pycache"
            GPT_STARTER_DIR = Join-Path $runtimeRoot "starter-files"
            THEME_ROOT = Join-Path $runtimeRoot "theme-root"
            TEMP = Join-Path $runtimeRoot "temp"
            TMP = Join-Path $runtimeRoot "temp"
          }

          foreach ($entry in $paths.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
          }

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run Stage 2 hermetic smoke
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-smoke-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

          $targets = @(
            "tests/test_repository_safety_tracked_cleanup.py",
            "tests/test_studio_categories.py",
            "tests/test_giclee_app_packaging.py",
            "tests/test_resend_diagnostic_script.py",
            "tests/test_stage1e_external_stores_3.py::test_title_drafts_write_external",
            "tests/test_stage1e_external_stores_3.py::test_launcher_config_reads_legacy_and_writes_roaming",
            "tests/test_tile_grid_appdata_settings.py",
            "tests/test_tytulyai_storage.py",
            "tests/test_studio_component_hub.py::test_filtered_components_without_gui",
            "tests/test_tcl_transient_retry.py"
          )

          python -m pytest -q `
            --junitxml="$reportRoot\junit.xml" `
            @targets 2>&1 | Tee-Object -FilePath "$reportRoot\pytest.txt"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload hermetic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-hermetic-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\stage2-smoke-reports
          if-no-files-found: error
          retention-days: 14

  tk-gui-smoke:
    name: Tk GUI smoke (Windows 2022)
    needs: hermetic-smoke
    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      )
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated runtime directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gicleeapp-tk"
          $paths = [ordered]@{
            LOCALAPPDATA = Join-Path $runtimeRoot "LocalAppData"
            APPDATA = Join-Path $runtimeRoot "AppData"
            GICLEEAPP_LOCAL_ROOT = Join-Path $runtimeRoot "LocalRoot"
            GICLEEAPP_ROAMING_ROOT = Join-Path $runtimeRoot "RoamingRoot"
            PYTHONPYCACHEPREFIX = Join-Path $runtimeRoot "pycache"
            GPT_STARTER_DIR = Join-Path $runtimeRoot "starter-files"
            THEME_ROOT = Join-Path $runtimeRoot "theme-root"
            TEMP = Join-Path $runtimeRoot "temp"
            TMP = Join-Path $runtimeRoot "temp"
          }

          foreach ($entry in $paths.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
          }

      - name: Prepare mirrored Tcl/Tk runtime
        shell: pwsh
        run: .\.github\scripts\prepare-tk-runtime.ps1 -RuntimeName "tk-gui"

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Probe Tcl/Tk and run GUI smoke
        id: tk_gui
        working-directory: cursor-api
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-tk-gui-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

          @'
          import tkinter as tk

          root = tk.Tk()
          root.withdraw()
          print("tk_patchlevel=" + str(root.tk.call("info", "patchlevel")))
          print("tcl_library=" + str(root.tk.globalgetvar("tcl_library")))
          print("tk_library=" + str(root.tk.globalgetvar("tk_library")))
          root.destroy()
          '@ | python - 2>&1 | Tee-Object -FilePath "$reportRoot\tk-probe.txt"

          $probeExit = $LASTEXITCODE
          "probe_exit_code=$probeExit" >> $env:GITHUB_OUTPUT
          if ($probeExit -ne 0) {
            "pytest_exit_code=not-run" >> $env:GITHUB_OUTPUT
            exit $probeExit
          }

          $targets = @(
            "tests/test_studio_component_hub.py::test_pin_toggle_does_not_rebuild_card_cache",
            "tests/test_studio_component_hub.py::test_hub_search_during_partial_render",
            "tests/test_studio_launcher_inline.py::test_return_from_inline_restores_hub_tiles",
            "tests/test_studio_launcher_inline.py::test_return_from_inline_with_inline_resize_restores_hub",
            "tests/test_studio_gicleeframe_visual_ready.py::test_gicleeframe_section_reentry_uses_minimal_cache",
            "tests/test_studio_gicleeframe_fast_selection.py::test_media_section_selection_defers_heavy_details_to_on_demand"
          )

          python -m pytest -q `
            --junitxml="$reportRoot\junit.xml" `
            @targets 2>&1 | Tee-Object -FilePath "$reportRoot\pytest.txt"

          $pytestExit = $LASTEXITCODE
          "pytest_exit_code=$pytestExit" >> $env:GITHUB_OUTPUT
          exit $pytestExit

      - name: Write Tk GUI summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Stage 2 Tk GUI smoke

          - runner: windows-2022
          - step outcome: ${{ steps.tk_gui.outcome }}
          - Tcl/Tk probe exit code: ${{ steps.tk_gui.outputs.probe_exit_code }}
          - GUI pytest exit code: ${{ steps.tk_gui.outputs.pytest_exit_code }}
          - mode: blocking
          - application runtime roots: isolated under RUNNER_TEMP
          - Tcl/Tk runtime: per-run RUNNER_TEMP mirror with SHA-256 manifest
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Tk GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-tk-gui-${{ github.run_id }}
          path: ${{ runner.temp }}\stage2-tk-gui-reports
          if-no-files-found: error
          retention-days: 14

  full-baseline:
    name: Full pytest baseline (Windows 2022)
    needs: tk-gui-smoke
    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      )
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated runtime directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeRoot = Join-Path $env:RUNNER_TEMP "gicleeapp-full"
          $paths = [ordered]@{
            LOCALAPPDATA = Join-Path $runtimeRoot "LocalAppData"
            APPDATA = Join-Path $runtimeRoot "AppData"
            GICLEEAPP_LOCAL_ROOT = Join-Path $runtimeRoot "LocalRoot"
            GICLEEAPP_ROAMING_ROOT = Join-Path $runtimeRoot "RoamingRoot"
            PYTHONPYCACHEPREFIX = Join-Path $runtimeRoot "pycache"
            GPT_STARTER_DIR = Join-Path $runtimeRoot "starter-files"
            THEME_ROOT = Join-Path $runtimeRoot "theme-root"
            TEMP = Join-Path $runtimeRoot "temp"
            TMP = Join-Path $runtimeRoot "temp"
          }

          foreach ($entry in $paths.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
            Set-Item -Path "Env:$($entry.Key)" -Value $entry.Value
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
          }

      - name: Prepare mirrored Tcl/Tk runtime
        shell: pwsh
        run: .\.github\scripts\prepare-tk-runtime.ps1 -RuntimeName "full-baseline"

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Warm Tcl/Tk on full-baseline runner
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-full-baseline-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

          python -m pytest -q `
            --junitxml="$reportRoot\warmup-junit.xml" `
            tests/test_studio_gicleeframe_fast_selection.py::test_media_section_selection_defers_heavy_details_to_on_demand `
            2>&1 | Tee-Object -FilePath "$reportRoot\warmup-pytest.txt"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Verify mirrored Tcl/Tk runtime before full baseline
        shell: pwsh
        run: .\.github\scripts\prepare-tk-runtime.ps1 -RuntimeName "full-baseline" -VerifyOnly

      - name: Run full pytest baseline
        id: full_pytest
        working-directory: cursor-api
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-full-baseline-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

          python -m pytest -q `
            --junitxml="$reportRoot\junit.xml" 2>&1 |
            Tee-Object -FilePath "$reportRoot\pytest.txt"

          $exitCode = $LASTEXITCODE
          $transient = "false"
          if ($exitCode -ne 0) {
            $transient = (python tools/stage2_tcl_failure.py "$reportRoot\pytest.txt").Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) {
              throw "Nie udało się sklasyfikować wyniku pełnego pytest."
            }
          }

          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "transient_tcl_failure=$transient" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Prepare fresh Tcl/Tk runtime for transient retry
        if: steps.full_pytest.outputs.transient_tcl_failure == 'true'
        shell: pwsh
        run: .\.github\scripts\prepare-tk-runtime.ps1 -RuntimeName "full-baseline-retry"

      - name: Run full pytest baseline retry
        id: full_pytest_retry
        if: steps.full_pytest.outputs.transient_tcl_failure == 'true'
        working-directory: cursor-api
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP "stage2-full-baseline-reports"

          python -m pytest -q `
            --junitxml="$reportRoot\junit-retry.xml" 2>&1 |
            Tee-Object -FilePath "$reportRoot\pytest-retry.txt"

          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Enforce full pytest baseline result
        if: always()
        shell: pwsh
        run: |
          $initialExit = "${{ steps.full_pytest.outputs.exit_code }}"
          $transient = "${{ steps.full_pytest.outputs.transient_tcl_failure }}"
          $retryExit = "${{ steps.full_pytest_retry.outputs.exit_code }}"

          if (-not $initialExit) {
            throw "Brak kodu wyjścia pierwszego pełnego pytest."
          }
          if ($initialExit -eq "0") {
            exit 0
          }
          if ($transient -ne "true") {
            throw "Pełny pytest zakończył się błędem nietransientnym (exit=$initialExit)."
          }
          if ($retryExit -ne "0") {
            throw "Jednorazowy retry pełnego pytest nie przeszedł (exit=$retryExit)."
          }

      - name: Write baseline summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Stage 2 full baseline

          - runner: windows-2022
          - warm-up: exact historical failing test on the same runner
          - pre-baseline mirror verification: path + length + SHA-256 and Tk/ttk preflight
          - initial pytest exit code: ${{ steps.full_pytest.outputs.exit_code }}
          - exact transient Tcl/Tk signature: ${{ steps.full_pytest.outputs.transient_tcl_failure }}
          - retry pytest exit code: ${{ steps.full_pytest_retry.outputs.exit_code }}
          - retry policy: at most once, whole suite, fresh Tcl/Tk mirror and fresh Python process
          - mode: blocking baseline; evidence is uploaded on every outcome
          - application runtime roots: isolated under RUNNER_TEMP
          - Tcl/Tk runtime: per-run RUNNER_TEMP mirror
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload full baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-full-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}\stage2-full-baseline-reports
          if-no-files-found: error
          retention-days: 14
