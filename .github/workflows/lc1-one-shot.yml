name: LC1 one-shot implementation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: >-
      github.head_ref == 'gpt-work/launcher-composition-lc1-explicit-root' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout LC-1 branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Apply explicit composition root
        run: python .github/scripts/apply_lc1.py

      - name: Install focused test dependencies
        working-directory: cursor-api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run LC-1 focused regression suite
        working-directory: cursor-api
        run: |
          python -m pytest -q \
            tests/test_launcher_composition.py \
            tests/test_launcher_tile_order.py \
            tests/test_launcher_shortcuts.py \
            tests/test_launcher_shortcuts_config.py \
            tests/test_launcher_delegate.py \
            tests/test_studio_imports.py \
            tests/test_giclee_app_packaging.py

      - name: Validate diff and scope
        run: |
          git diff --check
          git status --short
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '.github/scripts/apply_lc1.py',
              '.github/workflows/lc1-one-shot.yml',
              'cursor-api/giclee_app/launcher.py',
              'cursor-api/giclee_app/category_launcher.py',
              'cursor-api/giclee_app/styled_category_launcher.py',
              'cursor-api/giclee_app/options_category_launcher.py',
              'cursor-api/giclee_app/dragdrop_category_launcher.py',
              'cursor-api/tests/test_launcher_composition.py',
              'cursor-api/giclee_app/docs/launcher.md',
              'cursor-api/giclee_app/docs/launcher-composition-l0-contract.md',
          }
          rows = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {row[3:] for row in rows if row}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected paths: {unexpected}')
          required = {
              'cursor-api/giclee_app/launcher.py',
              'cursor-api/giclee_app/category_launcher.py',
              'cursor-api/giclee_app/styled_category_launcher.py',
              'cursor-api/giclee_app/options_category_launcher.py',
              'cursor-api/giclee_app/dragdrop_category_launcher.py',
              'cursor-api/tests/test_launcher_composition.py',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'missing required changes: {missing}')
          PY

      - name: Commit implementation and remove one-shot helpers
        run: |
          rm .github/workflows/lc1-one-shot.yml .github/scripts/apply_lc1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/lc1-one-shot.yml \
            .github/scripts/apply_lc1.py \
            cursor-api/giclee_app/launcher.py \
            cursor-api/giclee_app/category_launcher.py \
            cursor-api/giclee_app/styled_category_launcher.py \
            cursor-api/giclee_app/options_category_launcher.py \
            cursor-api/giclee_app/dragdrop_category_launcher.py \
            cursor-api/tests/test_launcher_composition.py \
            cursor-api/giclee_app/docs/launcher.md \
            cursor-api/giclee_app/docs/launcher-composition-l0-contract.md
          git commit -m 'refactor(launcher): use explicit composition root'
          git push origin HEAD:${{ github.head_ref }}
