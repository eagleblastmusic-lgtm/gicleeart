name: LC3C sync master once

on:
  pull_request:
    types: [synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  sync-master:
    if: github.event.pull_request.head.ref == 'gpt-work/launcher-composition-lc3c-tk-bindings'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout LC-3C branch
        uses: actions/checkout@v4
        with:
          ref: gpt-work/launcher-composition-lc3c-tk-bindings
          fetch-depth: 0
          persist-credentials: true

      - name: Merge exact master and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin master
          expected_master='a7f514fe4aaab023e918239f0a7e0a1b295e3053'
          actual_master="$(git rev-parse origin/master)"
          if [[ "$actual_master" != "$expected_master" ]]; then
            echo "master moved: expected $expected_master, got $actual_master" >&2
            exit 1
          fi
          git merge --no-ff --no-commit origin/master
          git rm .github/workflows/lc3c-sync-master-once.yml
          git commit -m 'Merge master into LC-3C after Stage 2 runtime fix'
          git push origin HEAD:gpt-work/launcher-composition-lc3c-tk-bindings
