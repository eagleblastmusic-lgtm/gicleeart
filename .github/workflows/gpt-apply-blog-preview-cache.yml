name: Apply blog preview cache patch

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'gpt-work/runtime-foundation-blog-preview-cache'
    runs-on: [self-hosted, Windows, X64, giclee-ci]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Apply exact patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/gpt-apply-blog-preview-cache.py
          python -m compileall -q `
            cursor-api/Komponenty/blog/preview.py `
            cursor-api/tests/test_blog_preview_appdata_cache.py
          git diff --check

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Validate focused contract
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_blog_preview_appdata_cache.py

      - name: Commit exact application changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            cursor-api/Komponenty/blog/preview.py `
            cursor-api/tests/test_blog_preview_appdata_cache.py `
            cursor-api/docs/repository_safety/BLOG_PREVIEW_CACHE.md
          git diff --cached --check
          git commit -m "refactor(runtime): externalize blog preview cache"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
