name: Apply blog preview cache patch

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'gpt-work/runtime-foundation-blog-preview-cache'
    runs-on: [self-hosted, Windows, X64, giclee-ci]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Apply exact patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patcher = ".github/scripts/gpt-apply-blog-preview-cache.py"
          $patcherText = Get-Content -LiteralPath $patcher -Raw
          $patcherText = $patcherText.Replace(
            "REPO_ROOT = Path(__file__).resolve().parents[2]",
            "REPO_ROOT = Path.cwd().resolve()"
          )
          Set-Content -LiteralPath $patcher -Value $patcherText -Encoding utf8

          python $patcher

          $expected = @(
            "cursor-api/Komponenty/blog/preview.py",
            "cursor-api/tests/test_blog_preview_appdata_cache.py",
            "cursor-api/docs/repository_safety/BLOG_PREVIEW_CACHE.md"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Patcher did not create expected file: $path"
            }
          }

          python -m compileall -q `
            cursor-api/Komponenty/blog/preview.py `
            cursor-api/tests/test_blog_preview_appdata_cache.py
          git diff --check

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Validate focused contract
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $reportRoot = Join-Path $env:RUNNER_TEMP "blog-preview-focused"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          python -m pytest -q tests/test_blog_preview_appdata_cache.py 2>&1 |
            Tee-Object -FilePath "$reportRoot\pytest.txt"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-preview-focused-${{ github.run_id }}
          path: ${{ runner.temp }}\blog-preview-focused
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact application changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            cursor-api/Komponenty/blog/preview.py `
            cursor-api/tests/test_blog_preview_appdata_cache.py `
            cursor-api/docs/repository_safety/BLOG_PREVIEW_CACHE.md
          git diff --cached --check
          git commit -m "refactor(runtime): externalize blog preview cache"
          git push origin "HEAD:$env:GITHUB_HEAD_REF"
