name: Apply theme liquid scripts extraction

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-extraction:
    if: github.event.pull_request.head.ref == 'gpt-work/theme-liquid-inline-scripts-extract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract post-layout inline runtime
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path.cwd()
          theme_path = root / 'layout/theme.liquid'
          snippet_path = root / 'snippets/giclee-theme-runtime.liquid'
          test_path = root / 'cursor-api/tests/test_theme_liquid_runtime_extraction.py'
          doc_path = root / 'cursor-api/docs/theme-liquid-runtime.md'

          theme = theme_path.read_text(encoding='utf-8')
          marker = "{% render 'giclee-theme-runtime' %}\n"
          start_anchor = "<script>\n  const observer = new IntersectionObserver"

          if marker not in theme:
              start = theme.index(start_anchor)
              end = theme.index('</body>', start)
              block = theme[start:end]
              if len(block.splitlines()) != 1526:
                  raise SystemExit(f'unexpected extracted block line count: {len(block.splitlines())}')
              digest = sha256(block.encode('utf-8')).hexdigest()
              if digest != '52648125da4c7c0ea6dc773032b77acc7fbd821225193c4bdf91fa7c1efe2d69':
                  raise SystemExit(f'unexpected extracted block digest: {digest}')
              rebuilt = theme[:start] + marker + theme[end:]
              if rebuilt.replace(marker, block, 1) != theme:
                  raise SystemExit('mechanical reconstruction check failed')
              snippet_path.write_text(block, encoding='utf-8')
              theme_path.write_text(rebuilt, encoding='utf-8')
          else:
              block = snippet_path.read_text(encoding='utf-8')

          test_path.write_text('''"""Mechanical extraction contract for post-layout inline theme runtime."""\n\nfrom __future__ import annotations\n\nfrom hashlib import sha256\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nTHEME = ROOT / "layout" / "theme.liquid"\nSNIPPET = ROOT / "snippets" / "giclee-theme-runtime.liquid"\nRENDER_MARKER = "{% render 'giclee-theme-runtime' %}\\n"\nEXPECTED_SNIPPET_SHA256 = "52648125da4c7c0ea6dc773032b77acc7fbd821225193c4bdf91fa7c1efe2d69"\nEXPECTED_ORIGINAL_THEME_SHA256 = "dc831ecc3eb615144af03b40213e3a2b3700bdd45e9cb058742a22493f9bbaec"\n\n\ndef test_theme_renders_extracted_runtime_once_before_body_close() -> None:\n    theme = THEME.read_text(encoding="utf-8")\n    assert theme.count(RENDER_MARKER) == 1\n    assert theme.index(RENDER_MARKER) < theme.index("</body>")\n    assert len(theme.splitlines()) == 353\n\n\ndef test_runtime_snippet_preserves_mechanical_source_region() -> None:\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    assert len(snippet.splitlines()) == 1526\n    assert sha256(snippet.encode("utf-8")).hexdigest() == EXPECTED_SNIPPET_SHA256\n    assert snippet.startswith("<script>\\n  const observer = new IntersectionObserver")\n    assert snippet.endswith("  {% endif %}\\n")\n\n\ndef test_runtime_snippet_keeps_liquid_and_execution_boundaries() -> None:\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    required = (\n        "{%- render 'giclee-catalog-panel', part: 'script' -%}",\n        "{{ 'MALE_ORG.webp' | asset_url | json }}",\n        "{% if template.suffix == 'fotografia-obraz' or template.suffix == 'szablon-wlasna-fotografia' %}",\n        "assign pm_cart_product = product",\n        "{% render 'giclee-site-notice' %}",\n        "{% if template.suffix == 'faq' %}",\n    )\n    for token in required:\n        assert token in snippet\n    assert snippet.count("<script") == 12\n    assert snippet.count("</script>") == 12\n\n\ndef test_reinserting_runtime_restores_original_theme_byte_for_byte() -> None:\n    theme = THEME.read_text(encoding="utf-8")\n    snippet = SNIPPET.read_text(encoding="utf-8")\n    reconstructed = theme.replace(RENDER_MARKER, snippet, 1)\n    assert len(reconstructed.splitlines()) == 1878\n    assert sha256(reconstructed.encode("utf-8")).hexdigest() == EXPECTED_ORIGINAL_THEME_SHA256\n''', encoding='utf-8')

          doc_path.write_text('''# Theme post-layout runtime extraction\n\nThe post-layout inline runtime previously embedded near the end of `layout/theme.liquid` now lives in:\n\n```text\nsnippets/giclee-theme-runtime.liquid\n```\n\nThe snippet contains the existing divider, accordion, product-card, homepage mobile, transition, photo-mockup, product-data, accessibility, catalog-panel, and site-notice runtime in its original order. It remains a Liquid snippet rather than a static JavaScript asset because it contains template/request objects, product data loops, asset URLs, conditional Liquid, and nested snippet renders.\n\n## Scope\n\n- mechanical move only;\n- no JavaScript statement, Liquid condition, product-data structure, nested render, or execution order change;\n- critical head and header-height scripts remain in `layout/theme.liquid`;\n- no deploy or live-theme mutation.\n\nThe regression contract records both the extracted-region SHA-256 and the original complete-theme SHA-256. Reinserting the snippet at the render marker must restore the pre-extraction theme byte-for-byte.\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layout/theme.liquid \
                  snippets/giclee-theme-runtime.liquid \
                  cursor-api/tests/test_theme_liquid_runtime_extraction.py \
                  cursor-api/docs/theme-liquid-runtime.md
          if git diff --cached --quiet; then
            echo "Theme runtime extraction already applied."
            exit 0
          fi
          git commit -m "Extract post-layout theme runtime"
          git push origin HEAD:${{ github.head_ref }}
