name: Stage 2 Giclee Frame Source Diagnostic

on:
  push:
    branches:
      - gpt-work/stage2-ci-gicleeframe-current-contracts
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  source-contracts:
    name: Giclee Frame source contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Giclee Frame source contracts
        working-directory: cursor-api
        run: |
          python -m pytest -q \
            tests/test_studio_gicleeframe_first_visible_sections_6g5f.py \
            tests/test_studio_gicleeframe_micro_batches_6g3.py \
            tests/test_studio_gicleeframe_perceived_responsiveness_6g4.py \
            tests/test_studio_gicleeframe_section_list_fast_lane_6g5j.py \
            tests/test_studio_gicleeframe_sections_column_early_lane_6g5k.py \
            tests/test_studio_gicleeframe_sections_column_early_lane_queue_6g5m.py \
            tests/test_studio_gicleeframe_top_bar_late_split_6g5h.py \
            tests/test_studio_gicleeframe_top_bar_lazy_actions_6g5g.py
