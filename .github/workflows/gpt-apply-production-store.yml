name: Apply production order store

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'gpt-work/runtime-foundation-production-store'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Prepare isolated runtime directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "production-store"
          $localRoot = Join-Path $runtimeRoot "LocalRoot"
          $roamingRoot = Join-Path $runtimeRoot "RoamingRoot"
          New-Item -ItemType Directory -Path $localRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $roamingRoot -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GICLEEAPP_LOCAL_ROOT=$localRoot"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GICLEEAPP_ROAMING_ROOT=$roamingRoot"

      - name: Apply exact production-store patch
        shell: pwsh
        run: python .\.github\scripts\gpt-apply-production-store.py

      - name: Validate syntax and scoped diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile `
            cursor-api\Komponenty\produkcja\production_store.py `
            cursor-api\Komponenty\produkcja\orders_sync.py `
            cursor-api\Komponenty\produkcja\retention.py `
            cursor-api\Komponenty\produkcja\view.py `
            cursor-api\Komponenty\produkcja\web_server.py `
            cursor-api\tests\test_production_store_appdata.py
          git diff --check

          $expected = @(
            "cursor-api/Komponenty/produkcja/orders_sync.py",
            "cursor-api/Komponenty/produkcja/retention.py",
            "cursor-api/Komponenty/produkcja/view.py",
            "cursor-api/Komponenty/produkcja/web_server.py"
          )
          $changed = @(git diff --name-only)
          if (@(Compare-Object $expected $changed).Count -ne 0) {
            throw "Unexpected patched files: $($changed -join ', ')"
          }

      - name: Install focused test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run focused production tests
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportRoot = Join-Path $env:RUNNER_TEMP "production-store-reports"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          python -m pytest -q `
            tests/test_production_store_appdata.py `
            tests/test_produkcja.py `
            tests/test_produkcja_extras.py `
            --junitxml="$reportRoot\junit.xml" 2>&1 |
            Tee-Object -FilePath "$reportRoot\pytest.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit production integration patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            "cursor-api/Komponenty/produkcja/orders_sync.py" `
            "cursor-api/Komponenty/produkcja/retention.py" `
            "cursor-api/Komponenty/produkcja/view.py" `
            "cursor-api/Komponenty/produkcja/web_server.py"
          git commit -m "refactor(runtime): externalize production order data"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-store-focused-${{ github.run_id }}
          path: ${{ runner.temp }}\production-store-reports
          if-no-files-found: warn
          retention-days: 14
