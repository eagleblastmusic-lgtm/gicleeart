name: LC3C one-shot implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'gpt-work/launcher-composition-lc3c-tk-bindings'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout LC-3C branch head
        uses: actions/checkout@v4
        with:
          ref: gpt-work/launcher-composition-lc3c-tk-bindings
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply Tk shortcut binding adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/fix_lc3c_escape.py
          python .github/scripts/apply_lc3c.py
          git checkout -- .github/scripts/apply_lc3c.py

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          pytest pillow requests customtkinter psutil packaging tkinterdnd2

      - name: Run LC-3C focused regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .artifacts/lc3c | Out-Null
          Push-Location cursor-api
          try {
            python -m pytest -q `
              tests/test_launcher_tk_shortcut_bindings.py `
              tests/test_launcher_shortcuts_config.py `
              tests/test_launcher_shortcut_controller.py `
              tests/test_launcher_windows_shortcuts.py `
              tests/test_launcher_composition.py `
              tests/test_launcher_tile_order.py `
              tests/test_giclee_app_packaging.py `
              --junitxml=../.artifacts/lc3c/junit.xml `
              2>&1 | Tee-Object -FilePath ../.artifacts/lc3c/pytest.txt
            if ($LASTEXITCODE -ne 0) {
              throw "LC-3C focused pytest failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload LC-3C focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lc3c-focused-${{ github.run_id }}
          path: .artifacts/lc3c
          if-no-files-found: warn
          retention-days: 7

      - name: Validate diff and scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff --check failed'
          }

          $allowed = @(
            'cursor-api/giclee_app/launcher_tk_shortcut_bindings.py',
            'cursor-api/giclee_app/options_category_launcher.py',
            'cursor-api/tests/test_launcher_tk_shortcut_bindings.py',
            'cursor-api/giclee_app/docs/launcher.md',
            'cursor-api/giclee_app/docs/launcher-composition-lc3c-contract.md'
          )
          $changed = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Sort-Object -Unique
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected LC-3C paths: $($unexpected -join ', ')"
          }
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($missing.Count -gt 0) {
            throw "Missing LC-3C paths: $($missing -join ', ')"
          }

      - name: Commit implementation and remove one-shot helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm `
            .github/scripts/apply_lc3c.py `
            .github/scripts/fix_lc3c_escape.py `
            .github/workflows/lc3c-one-shot.yml
          git add `
            cursor-api/giclee_app/launcher_tk_shortcut_bindings.py `
            cursor-api/giclee_app/options_category_launcher.py `
            cursor-api/tests/test_launcher_tk_shortcut_bindings.py `
            cursor-api/giclee_app/docs/launcher.md `
            cursor-api/giclee_app/docs/launcher-composition-lc3c-contract.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw 'staged diff check failed'
          }
          git commit -m 'refactor(launcher): extract Tk shortcut bindings'
          git push origin HEAD:gpt-work/launcher-composition-lc3c-tk-bindings
