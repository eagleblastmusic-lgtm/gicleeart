name: Map description mark persistence contracts

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  map:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build description mark persistence map
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "description-marks-map.txt"
          $tests = git ls-files "cursor-api/tests/*.py" | Where-Object { $_ -match "description|dodajobraz|mark" }
          "=== Candidate tests ===" | Set-Content -LiteralPath $out -Encoding utf8
          $tests | Add-Content -LiteralPath $out -Encoding utf8

          "`n=== References in tests ===" | Add-Content -LiteralPath $out -Encoding utf8
          $testFiles = Get-ChildItem -LiteralPath "cursor-api/tests" -Filter "*.py" -File
          $testFiles | Select-String -Pattern "description_update|_runtime_data_file|_save_marks_file|_DESCRIPTION_.*_FILE|_TITLE_UPDATE_MARKS_FILE|GICLEEAPP_LOCAL_ROOT" -AllMatches |
            ForEach-Object { "$($_.Path):$($_.LineNumber):$($_.Line)" } |
            Add-Content -LiteralPath $out -Encoding utf8

          "`n=== References in source ===" | Add-Content -LiteralPath $out -Encoding utf8
          Get-ChildItem -LiteralPath "cursor-api/Komponenty/dodajobraz" -Filter "*.py" -File |
            Select-String -Pattern "_runtime_data_file|_save_marks_file|_DESCRIPTION_.*_FILE|_TITLE_UPDATE_MARKS_FILE" -AllMatches |
            ForEach-Object { "$($_.Path):$($_.LineNumber):$($_.Line)" } |
            Add-Content -LiteralPath $out -Encoding utf8

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: description-marks-map-${{ github.run_id }}
          path: ${{ runner.temp }}/description-marks-map.txt
          if-no-files-found: error
          retention-days: 14
