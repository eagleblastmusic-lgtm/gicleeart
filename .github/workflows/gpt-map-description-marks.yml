name: Map description mark persistence contracts

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  map:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build description mark persistence map
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "description-marks-map.txt"
          $tests = git ls-files "cursor-api/tests/*.py" | Select-String -Pattern "description|dodajobraz|mark" -SimpleMatch:$false
          "=== Candidate tests ===" | Set-Content -LiteralPath $out -Encoding utf8
          $tests | ForEach-Object { $_.Line } | Add-Content -LiteralPath $out -Encoding utf8

          "`n=== References in tests ===" | Add-Content -LiteralPath $out -Encoding utf8
          rg -n --glob "cursor-api/tests/*.py" "description_update|_runtime_data_file|_save_marks_file|_DESCRIPTION_.*_FILE|_TITLE_UPDATE_MARKS_FILE|GICLEEAPP_LOCAL_ROOT" . 2>&1 | Add-Content -LiteralPath $out -Encoding utf8

          "`n=== References in source ===" | Add-Content -LiteralPath $out -Encoding utf8
          rg -n "_runtime_data_file|_save_marks_file|_DESCRIPTION_.*_FILE|_TITLE_UPDATE_MARKS_FILE" "cursor-api/Komponenty/dodajobraz" 2>&1 | Add-Content -LiteralPath $out -Encoding utf8

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: description-marks-map-${{ github.run_id }}
          path: ${{ runner.temp }}/description-marks-map.txt
          if-no-files-found: error
          retention-days: 14
