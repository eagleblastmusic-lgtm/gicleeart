name: Export theme page editor source

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: theme-page-editor-source-${{ github.run_id }}
          path: cursor-api/Komponenty/_shared/theme_page_editor/gui_shell.py
          if-no-files-found: error
          retention-days: 1
