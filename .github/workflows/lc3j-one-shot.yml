name: LC-3J one-shot implementation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: lc3j-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'gpt-work/launcher-composition-lc3j-category-persistence'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-work/launcher-composition-lc3j-category-persistence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Install test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Apply exact LC-3J patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/scripts/apply_lc3j.py

      - name: Run focused regression suite
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $reportRoot = Join-Path $env:RUNNER_TEMP "lc3j-focused"
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null
          python -m pytest -q `
            --junitxml="$reportRoot\junit.xml" `
            tests/test_launcher_drag_category_persistence.py `
            tests/test_launcher_tile_order.py `
            tests/test_launcher_drag_gesture.py `
            tests/test_launcher_tk_drag_auto_scroll.py `
            tests/test_launcher_tk_drag_feedback.py `
            tests/test_launcher_tk_drag_targets.py `
            tests/test_launcher_composition.py `
            tests/test_giclee_app_packaging.py 2>&1 | Tee-Object -FilePath "$reportRoot\pytest.txt"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lc3j-focused-${{ github.run_id }}
          path: ${{ runner.temp }}\lc3j-focused
          if-no-files-found: error
          retention-days: 14

      - name: Validate working diff and technical scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --check

          $allowed = @(
            ".github/scripts/apply_lc3j.py",
            ".github/workflows/lc3j-one-shot.yml",
            "cursor-api/giclee_app/docs/launcher-composition-lc3j-contract.md",
            "cursor-api/giclee_app/docs/launcher.md",
            "cursor-api/giclee_app/dragdrop_category_launcher.py",
            "cursor-api/giclee_app/launcher_drag_category_persistence.py",
            "cursor-api/tests/test_launcher_drag_category_persistence.py"
          ) | Sort-Object -Unique

          $changed = @(
            git diff --name-only origin/master...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique

          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            Write-Host "Changed:"; $changed | ForEach-Object { Write-Host "  $_" }
            Write-Host "Unexpected:"; $unexpected | ForEach-Object { Write-Host "  $_" }
            Write-Host "Missing:"; $missing | ForEach-Object { Write-Host "  $_" }
            throw "LC-3J technical scope guard failed"
          }

      - name: Remove one-shot tooling and create final commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -LiteralPath .github/scripts/apply_lc3j.py -Force
          Remove-Item -LiteralPath .github/workflows/lc3j-one-shot.yml -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(launcher): extract category order persistence"

      - name: Validate final five-file diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --check origin/master...HEAD

          $expected = @(
            "cursor-api/giclee_app/docs/launcher-composition-lc3j-contract.md",
            "cursor-api/giclee_app/docs/launcher.md",
            "cursor-api/giclee_app/dragdrop_category_launcher.py",
            "cursor-api/giclee_app/launcher_drag_category_persistence.py",
            "cursor-api/tests/test_launcher_drag_category_persistence.py"
          ) | Sort-Object -Unique
          $actual = @(git diff --name-only origin/master...HEAD) | Where-Object { $_ } | Sort-Object -Unique

          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($actual.Count -ne 5 -or $unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            Write-Host "Final diff:"; $actual | ForEach-Object { Write-Host "  $_" }
            throw "LC-3J final scope guard failed"
          }

      - name: Push final implementation head
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git push origin HEAD:gpt-work/launcher-composition-lc3j-category-persistence
