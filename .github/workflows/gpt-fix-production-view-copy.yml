name: Fix production AppData UI copy

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'gpt-work/runtime-foundation-production-store'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cursor-api/requirements-dev.txt

      - name: Apply exact copy fix
        shell: pwsh
        run: python .\.github\scripts\gpt-fix-production-view-copy.py

      - name: Validate scoped diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile cursor-api\Komponenty\produkcja\view.py
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "cursor-api/Komponenty/produkcja/view.py") {
            throw "Unexpected changed files: $($changed -join ', ')"
          }

      - name: Install focused test dependencies
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run production copy regression test
        working-directory: cursor-api
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q `
            tests/test_production_store_appdata.py `
            tests/test_produkcja.py `
            tests/test_produkcja_extras.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit production copy fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "cursor-api/Komponenty/produkcja/view.py"
          git commit -m "fix(runtime): correct production AppData UI copy"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
