name: Map Tcl Tk runtime integrity

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  map:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map Tcl Tk references and cleanup patterns
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "tk-runtime-map.txt"
          @'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          out = Path(os.environ["RUNNER_TEMP"]) / "tk-runtime-map.txt"
          refs = re.compile(
              r"TCL_LIBRARY|TK_LIBRARY|python-tcl-runtime|prepare-tk-runtime|"
              r"tk8\.6|tcl8\.6|spinbox\.tcl|defaults\.tcl"
          )
          cleanup = re.compile(
              r"rmtree|Remove-Item|unlink|shutil|tempfile|RUNNER_TEMP|"
              r"glob\(|iterdir\(|cleanup"
          )

          def collect(paths: list[Path], pattern: re.Pattern[str]) -> list[str]:
              found: list[str] = []
              for path in sorted(paths):
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError):
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if pattern.search(line):
                          found.append(f"{path.as_posix()}:{lineno}:{line}")
              return found

          all_files = [
              path
              for suffix in ("*.py", "*.ps1", "*.yml", "*.yaml")
              for path in root.rglob(suffix)
              if ".git" not in path.parts
          ]
          test_files = list((root / "cursor-api" / "tests").rglob("*.py"))
          lines = ["=== Tcl/Tk environment references ==="]
          lines.extend(collect(all_files, refs))
          lines.append("")
          lines.append("=== Temp cleanup and directory deletion patterns ===")
          lines.extend(collect(test_files, cleanup))
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | python -

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: tk-runtime-map-${{ github.run_id }}
          path: ${{ runner.temp }}/tk-runtime-map.txt
          if-no-files-found: error
          retention-days: 14
