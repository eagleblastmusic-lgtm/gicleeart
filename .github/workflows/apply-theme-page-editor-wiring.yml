name: Apply theme page editor wiring

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-wiring:
    if: github.event.pull_request.head.ref == 'gpt-work/theme-page-editor-direct-service-wiring-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply direct service wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          gui_path = root / 'cursor-api/Komponenty/_shared/theme_page_editor/gui_shell.py'
          bootstrap_path = root / 'cursor-api/Komponenty/_shared/theme_page_editor/bootstrap.py'
          test_path = root / 'cursor-api/tests/test_theme_page_editor_direct_service_wiring.py'

          gui = gui_path.read_text(encoding='utf-8')
          old_import = '''    save_template,\n    upload_image,\n    upload_video,\n)'''
          new_import = '''    save_template,\n    shopify_ref_label,\n    upload_image,\n    upload_video,\n)'''
          if '    shopify_ref_label,\n' not in gui:
              if old_import not in gui:
                  raise SystemExit('gui_shell service import anchor missing')
              gui = gui.replace(old_import, new_import, 1)
              gui_path.write_text(gui, encoding='utf-8')

          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          bootstrap = bootstrap.replace(
              'from Komponenty._shared.theme_page_editor.service_base import shopify_ref_label\n',
              '',
          )
          hotfix = '''\n# Hotfix zgodności: gui_shell używa shopify_ref_label przy budowie miniatur i\n# statusu tła, ale starsza powłoka nie importowała tej funkcji bezpośrednio.\n# Wstrzyknięcie na poziomie bootstrapu obejmuje wszystkie cienkie edytory stron.\ngui_shell.shopify_ref_label = shopify_ref_label\n'''
          if hotfix not in bootstrap:
              raise SystemExit('bootstrap monkey-patch anchor missing')
          bootstrap = bootstrap.replace(hotfix, '\n', 1)
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          test_path.write_text('''"""Theme Page Editor imports its service dependencies directly."""\n\nfrom __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\nfrom Komponenty._shared.theme_page_editor import bootstrap, gui_shell\nfrom Komponenty._shared.theme_page_editor.service_base import shopify_ref_label\n\nROOT = Path(__file__).resolve().parents[1]\nBOOTSTRAP = ROOT / "Komponenty" / "_shared" / "theme_page_editor" / "bootstrap.py"\nGUI_SHELL = ROOT / "Komponenty" / "_shared" / "theme_page_editor" / "gui_shell.py"\n\n\ndef test_gui_shell_owns_direct_shopify_ref_label_import() -> None:\n    assert gui_shell.shopify_ref_label is shopify_ref_label\n\n    tree = ast.parse(GUI_SHELL.read_text(encoding="utf-8"))\n    imported = {\n        alias.name\n        for node in tree.body\n        if isinstance(node, ast.ImportFrom) and node.module == "service_base"\n        for alias in node.names\n    }\n    assert "shopify_ref_label" in imported\n\n\ndef test_bootstrap_contains_no_gui_shell_monkey_patch() -> None:\n    source = BOOTSTRAP.read_text(encoding="utf-8")\n    assert "gui_shell.shopify_ref_label" not in source\n    assert "shopify_ref_label =" not in source\n    assert bootstrap.gui_shell is gui_shell\n\n\ndef test_bootstrap_stays_a_thin_editor_composition_boundary() -> None:\n    tree = ast.parse(BOOTSTRAP.read_text(encoding="utf-8"))\n    assignments = [\n        node\n        for node in ast.walk(tree)\n        if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign))\n    ]\n    assert assignments == []\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursor-api/Komponenty/_shared/theme_page_editor/gui_shell.py \
                  cursor-api/Komponenty/_shared/theme_page_editor/bootstrap.py \
                  cursor-api/tests/test_theme_page_editor_direct_service_wiring.py
          if git diff --cached --quiet; then
            echo "Direct wiring already applied."
            exit 0
          fi
          git commit -m "Wire Theme Page Editor services directly"
          git push origin HEAD:${{ github.head_ref }}
